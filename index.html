<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web VR シアター</title>
  <!-- A-Frame ライブラリの読み込み -->
  <script src="https://aframe.io"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    /* 初期メニュー画面のオーバーレイ */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 20, 0.92);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.9rem;
      color: #ccc;
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    .btn:active {
      transform: scale(0.98);
    }
    #file-input {
      display: none;
    }
    /* 再生中の簡易コントロール（画面タップで表示切替） */
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      display: none;
      gap: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 25px;
    }
    .ctrl-btn {
      background: #444;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 15px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- スタート画面 -->
  <div id="overlay">
    <h1>🎬 Web VR シアター</h1>
    <p>端末内の動画ファイル（MP4など）を選択して、映画館の大画面で楽しめます。スマホを動かすと視点が連動します。</p>
    
    <label for="file-input" class="btn">動画を選択して開始</label>
    <input type="file" id="file-input" accept="video/*">
    
    <p style="font-size: 0.75rem; color: #888; margin-top: 20px;">
      ※iPhone(iOS)は開始時にジャイロセンサーの許可が必要です。<br>
      ※右下のVRゴーグルアイコンを押すと2画面(VRモード)になります。
    </p>
  </div>

  <!-- 再生コントロール -->
  <div id="controls">
    <button class="ctrl-btn" id="play-pause-btn">一時停止</button>
    <button class="ctrl-btn" id="reset-view-btn">正面リセット</button>
    <button class="ctrl-btn" id="change-video-btn">動画変更</button>
  </div>

  <!-- VR空間 (A-Frame) -->
  <a-scene vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true;">
    <a-assets>
      <!-- 動画要素（JSでソースを割り当て） -->
      <video id="theater-video" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
    </a-assets>

    <!-- 暗い映画館の環境光とスポットライト -->
    <a-light type="ambient" color="#222233" intensity="0.6"></a-light>
    <a-light type="point" position="0 4 -2" color="#ffffff" intensity="0.4"></a-light>

    <!-- 映画館の部屋（壁・天井・床） -->
    <!-- 床 -->
    <a-plane position="0 -2 -5" rotation="-90 0 0" width="20" height="25" color="#1a0d0d"></a-plane>
    <!-- 天井 -->
    <a-plane position="0 8 -5" rotation="90 0 0" width="20" height="25" color="#0d0d12"></a-plane>
    <!-- 左壁 -->
    <a-plane position="-10 3 -5" rotation="0 90 0" width="25" height="10" color="#14141c"></a-plane>
    <!-- 右壁 -->
    <a-plane position="10 3 -5" rotation="0 -90 0" width="25" height="10" color="#14141c"></a-plane>
    <!-- 前壁（スクリーン奥） -->
    <a-plane position="0 3 -15" rotation="0 0 0" width="20" height="10" color="#08080a"></a-plane>
    <!-- 後壁 -->
    <a-plane position="0 3 7" rotation="0 180 0" width="20" height="10" color="#14141c"></a-plane>

    <!-- スクリーン枠（黒縁） -->
    <a-plane position="0 2.5 -14.85" width="16.4" height="9.4" color="#000000"></a-plane>
    <!-- メインスクリーン（16:9比率） -->
    <a-video id="screen" src="#theater-video" position="0 2.5 -14.8" width="16" height="9"></a-video>

    <!-- 座席（雰囲気用の前列シート群） -->
    

    <!-- ユーザー視点（カメラ＋ジャイロ操作） -->
    
      <a-camera id="main-camera" look-controls="magicWindowTrackingEnabled: true; touchEnabled: true;"></a-camera>
    
  </a-scene>

  <script>
    const fileInput = document.getElementById('file-input');
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('theater-video');
    const screen = document.getElementById('screen');
    const controls = document.getElementById('controls');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const resetViewBtn = document.getElementById('reset-view-btn');
    const changeVideoBtn = document.getElementById('change-video-btn');
    const cameraRig = document.getElementById('camera-rig');
    const mainCamera = document.getElementById('main-camera');

    // 映画館の座席を自動生成して雰囲気を出す
    const seatsContainer = document.getElementById('seats');
    for (let row = 0; row < 3; row++) {
      for (let col = -4; col <= 4; col++) {
        const seat = document.createElement('a-box');
        seat.setAttribute('position', `${col * 1.4} ${-1.2 - row * 0.2} ${-3 - row * 2.5}`);
        seat.setAttribute('width', '0.9');
        seat.setAttribute('height', '1.2');
        seat.setAttribute('depth', '0.6');
        seat.setAttribute('color', '#3a0e14');
        seatsContainer.appendChild(seat);
      }
    }

    // 動画選択時の処理
    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      // iOS 13+ 向けのジャイロセンサー許可リクエスト
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            alert('ジャイロセンサーが許可されませんでした。指でのスワイプ操作のみ有効になります。');
          }
        } catch (e) {
          console.error(e);
        }
      }

      // 選択されたローカル動画をURL化して読み込み
      const fileURL = URL.createObjectURL(file);
      video.src = fileURL;

      // 動画のアスペクト比に合わせてスクリーンサイズを自動調整
      video.onloadedmetadata = () => {
        const aspect = video.videoWidth / video.videoHeight;
        const screenHeight = 9;
        const screenWidth = screenHeight * aspect;
        screen.setAttribute('width', screenWidth);
        screen.setAttribute('height', screenHeight);
        // 黒縁も調整
        screen.previousElementSibling.setAttribute('width', screenWidth + 0.4);
        screen.previousElementSibling.setAttribute('height', screenHeight + 0.4);
      };

      overlay.style.display = 'none';
      controls.style.display = 'flex';
      video.play();
    });

    // 再生 / 一時停止ボタン
    playPauseBtn.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        playPauseBtn.textContent = '一時停止';
      } else {
        video.pause();
        playPauseBtn.textContent = '再生';
      }
    });

    // 正面リセット（寝転んで見る時などに便利）
    resetViewBtn.addEventListener('click', () => {
      const currentRot = mainCamera.getAttribute('rotation');
      cameraRig.setAttribute('rotation', `0 ${-currentRot.y} 0`);
    });

    // 別の動画を選ぶ
    changeVideoBtn.addEventListener('click', () => {
      video.pause();
      fileInput.value = '';
      overlay.style.display = 'flex';
      controls.style.display = 'none';
    });
  </script>
</body>
</html>
