<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebVR シアター</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #0b0c10; color: #fff; }
    #ui {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(15, 18, 28, 0.85); padding: 14px 18px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
      display: flex; flex-direction: column; gap: 10px; max-width: 340px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select {
      background: #1f2833; color: #fff; border: 1px solid #45a29e;
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #2c3a4b; }
    small { color: #9aa5b1; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="ui">
    <strong>VR 映画館プレイヤー</strong>
    <input type="file" id="fileInput" accept="video/*" />
    <div class="row">
      <button id="playBtn">再生 / 一時停止</button>
      <select id="modeSelect">
        <option value="screen">映画館スクリーン（平面/湾曲）</option>
        <option value="360">360° 全天球VRモード</option>
      </select>
      <button id="lightBtn">館内照明 切替</button>
    </div>
    <small>
      マウスドラッグで視点移動、WASDで席の前後左右移動。<br />
      VRゴーグルでは右下のVRボタンからWebXRに入れます。
    </small>
  </div>

  <video id="vrVideo" crossorigin="anonymous" playsinline loop style="display:none"></video>

  <a-scene id="scene" vr-mode-ui="enabled: true">
    <!-- 館内照明 -->
    <a-light id="ambientLight" type="ambient" color="#667799" intensity="0.6"></a-light>
    <a-light id="screenGlow" type="point" color="#aaccff" intensity="1.2" position="0 4 -8" distance="25"></a-light>

    <!-- 映画館の床・壁・座席イメージ -->
    <a-plane id="floor" rotation="-90 0 0" width="24" height="30" color="#161822" position="0 0 -5"></a-plane>
    <a-box id="backWall" position="0 5 10" width="24" height="10" depth="0.5" color="#12141c"></a-box>
    <a-box id="leftWall" position="-12 5 -5" width="0.5" height="10" depth="30" color="#12141c"></a-box>
    <a-box id="rightWall" position="12 5 -5" width="0.5" height="10" depth="30" color="#12141c"></a-box>

    <!-- 前の座席（背もたれシルエット） -->
    <a-box position="-2.2 0.55 -6.5" width="1.1" height="1.1" depth="0.4" color="#24161b"></a-box>
    <a-box position="0 0.55 -6.5" width="1.1" height="1.1" depth="0.4" color="#24161b"></a-box>
    <a-box position="2.2 0.55 -6.5" width="1.1" height="1.1" depth="0.4" color="#24161b"></a-box>

    <!-- 映画館スクリーン -->
    <a-curvedimage
      id="cinemaScreen"
      src="#vrVideo"
      radius="11"
      theta-length="65"
      theta-start="-32.5"
      height="6.2"
      position="0 4.2 -1"
      material="shader: flat; side: double"
    ></a-curvedimage>

    <!-- 360度動画用スカイ球体（初期は非表示） -->
    <a-sky id="sky360" src="#vrVideo" visible="false" material="shader: flat"></a-sky>

    <!-- 観客カメラ -->
    <a-entity id="rig" position="0 1.6 -3.5">
      <a-camera look-controls wasd-controls></a-camera>
    </a-entity>
  </a-scene>

  <script>
    const fileInput = document.getElementById('fileInput');
    const video = document.getElementById('vrVideo');
    const playBtn = document.getElementById('playBtn');
    const modeSelect = document.getElementById('modeSelect');
    const lightBtn = document.getElementById('lightBtn');
    const cinemaScreen = document.getElementById('cinemaScreen');
    const sky360 = document.getElementById('sky360');
    const ambientLight = document.getElementById('ambientLight');
    const theaterProps = ['floor', 'backWall', 'leftWall', 'rightWall'];

    let lightsDimmed = false;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      video.src = url;
      video.play().catch(() => {});
    });

    playBtn.addEventListener('click', () => {
      if (!video.src) return;
      if (video.paused) video.play();
      else video.pause();
    });

    modeSelect.addEventListener('change', () => {
      const is360 = modeSelect.value === '360';
      cinemaScreen.setAttribute('visible', !is360);
      sky360.setAttribute('visible', is360);
      theaterProps.forEach((id) => {
        document.getElementById(id).setAttribute('visible', !is360);
      });
    });

    lightBtn.addEventListener('click', () => {
      lightsDimmed = !lightsDimmed;
      ambientLight.setAttribute('intensity', lightsDimmed ? 0.12 : 0.6);
    });
  </script>
</body>
</html>
