<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web VR シアター</title>
  <script src="https://aframe.io"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 20, 0.95);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.9rem;
      color: #ccc;
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
      display: inline-block;
    }
    .btn:active {
      transform: scale(0.98);
    }
    #file-input {
      display: none;
    }
    #status-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 1.2em;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      display: none;
      gap: 10px;
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 18px;
      border-radius: 25px;
      white-space: nowrap;
    }
    .ctrl-btn {
      background: #444;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 15px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- スタート画面 -->
  <div id="overlay">
    <h1>🎬 Web VR シアター</h1>
    <p>端末内の動画ファイル（MP4 / MOVなど）を選択して映画館の大画面で再生します。</p>
    
    <!-- iOSのファイル選択不具合を防ぐためacceptを広めに設定 -->
    <label for="file-input" class="btn" id="select-label">動画を選択して開始</label>
    <input type="file" id="file-input" accept="video/*,video/mp4,video/quicktime">
    
    <div id="status-msg"></div>

    <p style="font-size: 0.75rem; color: #888; margin-top: 20px;">
      ※スマホを動かすと視点が連動します。<br>
      ※右下のゴーグルアイコンでVR2画面表示になります。
    </p>
  </div>

  <!-- 再生コントロール -->
  <div id="controls">
    <button class="ctrl-btn" id="play-pause-btn">一時停止</button>
    <button class="ctrl-btn" id="reset-view-btn">正面リセット</button>
    <button class="ctrl-btn" id="change-video-btn">動画変更</button>
  </div>

  <!-- VR空間 -->
  <a-scene vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true;">
    <a-assets>
      <video id="theater-video" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
    </a-assets>

    <!-- 照明 -->
    <a-light type="ambient" color="#222233" intensity="0.6"></a-light>
    <a-light type="point" position="0 4 -2" color="#ffffff" intensity="0.4"></a-light>

    <!-- 映画館の部屋 -->
    <a-plane position="0 -2 -5" rotation="-90 0 0" width="20" height="25" color="#1a0d0d"></a-plane>
    <a-plane position="0 8 -5" rotation="90 0 0" width="20" height="25" color="#0d0d12"></a-plane>
    <a-plane position="-10 3 -5" rotation="0 90 0" width="25" height="10" color="#14141c"></a-plane>
    <a-plane position="10 3 -5" rotation="0 -90 0" width="25" height="10" color="#14141c"></a-plane>
    <a-plane position="0 3 -15" rotation="0 0 0" width="20" height="10" color="#08080a"></a-plane>
    <a-plane position="0 3 7" rotation="0 180 0" width="20" height="10" color="#14141c"></a-plane>

    <!-- スクリーン枠とスクリーン -->
    <a-plane id="screen-frame" position="0 2.5 -14.85" width="16.4" height="9.4" color="#000000"></a-plane>
    <a-video id="screen" src="#theater-video" position="0 2.5 -14.8" width="16" height="9"></a-video>

    <!-- 座席 -->
    

    <!-- カメラ -->
    
      <a-camera id="main-camera" look-controls="magicWindowTrackingEnabled: true; touchEnabled: true;"></a-camera>
    
  </a-scene>

  <script>
    const fileInput = document.getElementById('file-input');
    const selectLabel = document.getElementById('select-label');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('status-msg');
    const video = document.getElementById('theater-video');
    const screen = document.getElementById('screen');
    const screenFrame = document.getElementById('screen-frame');
    const controls = document.getElementById('controls');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const resetViewBtn = document.getElementById('reset-view-btn');
    const changeVideoBtn = document.getElementById('change-video-btn');
    const cameraRig = document.getElementById('camera-rig');
    const mainCamera = document.getElementById('main-camera');

    // 座席の生成
    const seatsContainer = document.getElementById('seats');
    for (let row = 0; row < 3; row++) {
      for (let col = -4; col <= 4; col++) {
        const seat = document.createElement('a-box');
        seat.setAttribute('position', `${col * 1.4} ${-1.2 - row * 0.2} ${-3 - row * 2.5}`);
        seat.setAttribute('width', '0.9');
        seat.setAttribute('height', '1.2');
        seat.setAttribute('depth', '0.6');
        seat.setAttribute('color', '#3a0e14');
        seatsContainer.appendChild(seat);
      }
    }

    // iOS向け：ボタンタップの瞬間にジャイロ許可をリクエストする
    selectLabel.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(console.error);
      }
    });

    // 動画選択時の処理
    fileInput.addEventListener('change', (event) => {
      // 【修正箇所】先頭のファイル[0]を正しく取得
      const file = event.target.files[0];
      if (!file) return;

      statusMsg.textContent = '動画を読み込み中...';

      const fileURL = URL.createObjectURL(file);
      video.src = fileURL;
      video.load();

      // メタデータ読み込み完了後にアスペクト比調整
      video.onloadedmetadata = () => {
        if (video.videoWidth && video.videoHeight) {
          const aspect = video.videoWidth / video.videoHeight;
          const screenHeight = 9;
          const screenWidth = screenHeight * aspect;
          screen.setAttribute('width', screenWidth);
          screen.setAttribute('height', screenHeight);
          screenFrame.setAttribute('width', screenWidth + 0.4);
          screenFrame.setAttribute('height', screenHeight + 0.4);
        }
      };

      // 再生開始（自動再生ブロック対策付き）
      video.play().then(() => {
        overlay.style.display = 'none';
        controls.style.display = 'flex';
        playPauseBtn.textContent = '一時停止';
        statusMsg.textContent = '';
      }).catch((err) => {
        // ブラウザ制限で自動再生がブロックされた場合でも画面を開いて再生ボタンを押せるようにする
        console.warn('自動再生ブロック:', err);
        overlay.style.display = 'none';
        controls.style.display = 'flex';
        playPauseBtn.textContent = '再生する';
        statusMsg.textContent = '';
      });
    });

    // 再生 / 一時停止
    playPauseBtn.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        playPauseBtn.textContent = '一時停止';
      } else {
        video.pause();
        playPauseBtn.textContent = '再生';
      }
    });

    // 正面リセット
    resetViewBtn.addEventListener('click', () => {
      const currentRot = mainCamera.getAttribute('rotation');
      cameraRig.setAttribute('rotation', `0 ${-currentRot.y} 0`);
    });

    // 動画変更
    changeVideoBtn.addEventListener('click', () => {
      video.pause();
      fileInput.value = '';
      overlay.style.display = 'flex';
      controls.style.display = 'none';
    });
  </script>
</body>
</html>
